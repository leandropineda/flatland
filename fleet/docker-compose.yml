# Simulated fleet: one flatland world, one nav2 container per robot.
# WORLD=office|warehouse picks the world; LOCALIZATION=amcl (default, known
# map, shared `map` frame) or slam (each robot maps from scratch).
# Everything shares one DDS domain on the default compose network; robots are
# separated by ROS namespace (topics) and frame prefix (TF), not by domain.
#
#   docker compose up --build -d
#   ./ctl.sh status
#
# Add a robot: add a models: entry in sim/worlds/<WORLD>/world.yaml + one service below.

x-ros-env: &ros-env
  # CycloneDDS: no shared-memory transport, so containers talk plain UDP over
  # the bridge network with zero extra config (FastDDS SHM breaks silently
  # across containers). On k8s swap discovery to a Fast DDS discovery server
  # or CYCLONEDDS_URI unicast peers; nothing else changes.
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}

x-robot: &robot
  build:
    context: .
    dockerfile: Dockerfile.nav2
    args:
      ROS_DISTRO: ${ROS_DISTRO:-jazzy}
  image: fleet-nav2:${ROS_DISTRO:-jazzy}
  environment: *ros-env
  volumes:
    - ./sim:/fleet/sim:ro   # world map doubles as the AMCL localization map
  depends_on:
    - sim
  restart: unless-stopped

services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: flatland:${ROS_DISTRO:-jazzy}
    container_name: fleet-sim
    environment: *ros-env
    volumes:
      - ./sim:/fleet/sim:ro
    command: >
      ros2 run flatland_server flatland_server --ros-args
      -p world_path:=/fleet/sim/worlds/${WORLD:-office}/world.yaml
      -p update_rate:=50.0
      -p step_size:=0.02
      -p show_viz:=${SHOW_VIZ:-true}
      -p viz_pub_rate:=10.0
    restart: unless-stopped

  robot1:
    <<: *robot
    container_name: fleet-robot1
    command: >
      ros2 launch /fleet/nav2/robot.launch.py namespace:=robot1
      localization:=${LOCALIZATION:-amcl}
      world_dir:=/fleet/sim/worlds/${WORLD:-office}

  robot2:
    <<: *robot
    container_name: fleet-robot2
    command: >
      ros2 launch /fleet/nav2/robot.launch.py namespace:=robot2
      localization:=${LOCALIZATION:-amcl}
      world_dir:=/fleet/sim/worlds/${WORLD:-office}

  robot3:
    <<: *robot
    container_name: fleet-robot3
    command: >
      ros2 launch /fleet/nav2/robot.launch.py namespace:=robot3
      localization:=${LOCALIZATION:-amcl}
      world_dir:=/fleet/sim/worlds/${WORLD:-office}

  # Optional world view: docker compose --profile viz up -d
  # Needs an X display on the host: xhost +local:docker
  rviz:
    build:
      context: .
      dockerfile: Dockerfile.rviz
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: fleet-rviz:${ROS_DISTRO:-jazzy}
    container_name: fleet-rviz
    profiles: [viz]
    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      WORLD: ${WORLD:-office}
      LOCALIZATION: ${LOCALIZATION:-amcl}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./sim:/fleet/sim:ro
    devices:
      - /dev/dri:/dev/dri
    command: ros2 launch /fleet/rviz/rviz.launch.py
    depends_on:
      - sim
