# Office world (65 x 25 m floorplan).
# Robots: unique name/namespace + a free-space pose; the shared model is one
# level up. Selected via WORLD=office in the compose files.
properties: {}

layers:
  - name: "2d"
    map: "map.yaml"
    color: [0.4, 0.4, 0.4, 1]

models:
  - name: robot1
    namespace: robot1
    pose: [2.0, 1.0, 0.0]
    model: "../../turtlebot.model.yaml"
  - name: robot2
    namespace: robot2
    pose: [2.0, 3.0, 0.0]
    model: "../../turtlebot.model.yaml"
  - name: robot3
    namespace: robot3
    pose: [4.0, 2.0, 1.5708]
    model: "../../turtlebot.model.yaml"
