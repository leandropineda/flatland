name: build

on:
  push:
    branches: [ros2-devel]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy, kilted, lyrical]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (${{ matrix.ros_distro }})
        run: |
          docker build -f docker/Dockerfile \
            --build-arg ROS_DISTRO=${{ matrix.ros_distro }} \
            -t $REGISTRY/flatland-sim:${{ matrix.ros_distro }} .
          docker build -f fleet/Dockerfile.nav2 \
            --build-arg ROS_DISTRO=${{ matrix.ros_distro }} \
            -t $REGISTRY/flatland-fleet-nav2:${{ matrix.ros_distro }} fleet
          docker build -f fleet/Dockerfile.rviz \
            --build-arg ROS_DISTRO=${{ matrix.ros_distro }} \
            -t $REGISTRY/flatland-fleet-rviz:${{ matrix.ros_distro }} fleet
      - name: Test (${{ matrix.ros_distro }})
        # --retest-until-pass: the service/laser integration tests spin up a
        # full node graph and can miss DDS discovery on slow CI runners
        run: >
          docker run --rm $REGISTRY/flatland-sim:${{ matrix.ros_distro }} bash -c
          "cd /ws && colcon test --retest-until-pass 2
          && colcon test-result --verbose"
      # Publish so the images are usable without cloning the repo. Only on
      # branch pushes (never PRs), and only after the tests passed.
      - name: Push (${{ matrix.ros_distro }})
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          for img in flatland-sim flatland-fleet-nav2 flatland-fleet-rviz; do
            docker push $REGISTRY/$img:${{ matrix.ros_distro }}
            docker tag $REGISTRY/$img:${{ matrix.ros_distro }} $REGISTRY/$img:${{ matrix.ros_distro }}-${GITHUB_SHA::8}
            docker push $REGISTRY/$img:${{ matrix.ros_distro }}-${GITHUB_SHA::8}
          done
